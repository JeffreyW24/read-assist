<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>eyeRead · camera access</title>
  <style>
    body { font: 15px/1.5 system-ui, -apple-system, sans-serif; max-width: 520px; margin: 12vh auto; padding: 0 16px; color: #1c1917; background: #fafaf9; }
    button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid #1c1917; background: #1c1917; color: #fff; cursor: pointer; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Allow camera for eye tracking</h1>
  <p>eyeRead runs the eye tracker in a hidden background page, which can't ask for camera access itself. Click below once and allow the camera; Chrome remembers it for the extension.</p>
  <p>Video is processed on this computer only and never uploaded.</p>
  <button id="allow">Allow camera</button>
  <p id="status"></p>
  <script src="dist/permission.js"></script>
</body>
</html>
